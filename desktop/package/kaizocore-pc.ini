# KaizoCore PC settings. Lines starting with # are notes. Leave a line empty to use the default.

# Your Heart & Soul 2.0.6 .gba, or your KaizoCore Heart & Soul build.
# Empty: KaizoCore PC uses the one it finds in this folder.
build=

# The randomizer settings: a preset name or a .rnqs file. Default: RSE NatDex v1.2 Kaizo
settings=

# natdex or vanilla. Default: from the settings name, else natdex.
pool=

# besteon's Ironmon-Tracker folder (the one with Settings.ini). With it, New Run uses the same button combo
# as the tracker, and the runs and the attempts count go where its New Run puts them.
tracker=

# Where the runs go when no tracker folder is given. Default: the runs folder here.
out=

# KaizoCore PC looks once at start for a newer release (willowcreek.group/kaizocore/latest.json) and says so in its
# window. off: never look.
updates=

# Twitch chat: KaizoCore PC answers !pokemon, !moves, !attempts, !progress, !heals and, for your mods, !fav once you
# connect your Twitch account in its window (or with "KaizoCore PC.bat twitch"). off: no chat at all.
twitch=
